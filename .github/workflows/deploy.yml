name: Build and deploy Falchion to GitHub Pages and Fly.io

# Every push to every branch (and manual dispatch) is checked and deployed.
# Each deploy overwrites the previous one, so the most recent commit on any
# branch is what ends up live.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NO workflow-level concurrency: cancelling the whole run on a newer push
# would also cancel an in-flight Fly deploy. Concurrency is set per job.

jobs:
  build:
    name: Typecheck, test, specs, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cancelling a build is safe; only the newest site needs to deploy.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    env:
      OPENSPEC_TELEMETRY: '0'
    outputs:
      pages: ${{ steps.pages_gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run spec:validate
      - run: npm run build
      - name: Server smoke test
        run: |
          STATIC_DIR=dist PORT=8090 node server/index.mjs &
          for i in $(seq 1 20); do curl -fsS localhost:8090/healthz && break; sleep 0.5; done
          curl -fsS localhost:8090/ | grep -q '<div id="app">'
          curl -fsS localhost:8090/api/info
          kill %1
      # Pre-bootstrap is "skip, don't fail": until Pages is enabled with
      # source "GitHub Actions" (Settings -> Pages), the Pages deploy skips.
      - name: Check Pages readiness
        id: pages_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled with source 'GitHub Actions'; skipping Pages deploy. Enable it in Settings -> Pages."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages_gate.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_gate.outputs.ready == 'true'
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    # Never cancel a Pages deploy mid-flight: an orphaned in-progress
    # deployment blocks later deploys. Queue them; the newest lands last.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-fly:
    name: Deploy to Fly.io
    needs: build
    runs-on: ubuntu-latest
    # Only the canonical repo deploys (forks fall through cleanly).
    if: ${{ contains(fromJSON('["rubentipparach/falchion", "RubenTipparach/Falchion"]'), github.repository) }}
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      APP: falchion
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Pre-bootstrap is "skip, don't fail": a missing/invalid token or a
      # not-yet-created app marks ready=false. See server/fly.toml for setup.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set; skipping Fly deploy. See server/fly.toml for one-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN rejected by Fly; skipping. Regenerate with 'fly tokens create deploy -a $APP'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl status -a "$APP" > /dev/null 2>&1; then
            echo "::notice::Fly app '$APP' not found; skipping. Bootstrap with 'fly apps create $APP'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Stage optional Discord secrets so the release boots with them
      # (--stage defers the restart to the deploy below). Unset Actions
      # secrets are left untouched on Fly.
      - name: Sync Discord secrets to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -e
          stage_secret() {
            if [ -n "$2" ]; then
              echo "Staging $1"
              flyctl secrets set "$1=$2" --app "$APP" --stage
            else
              echo "::notice::$1 not set in Actions secrets; leaving Fly value untouched."
            fi
          }
          stage_secret DISCORD_BOT_TOKEN     "${DISCORD_BOT_TOKEN}"
          stage_secret DISCORD_CLIENT_ID     "${DISCORD_CLIENT_ID}"
          stage_secret DISCORD_CLIENT_SECRET "${DISCORD_CLIENT_SECRET}"
          stage_secret DISCORD_GUILD_ID      "${DISCORD_GUILD_ID}"
          stage_secret DISCORD_WEBHOOK_URL   "${DISCORD_WEBHOOK_URL}"

      # Built from the repo root (see server/Dockerfile). Retries with
      # backoff because Fly's remote builder can drop connections transiently.
      - name: Deploy to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          SHA="$(git rev-parse --short HEAD)"
          for attempt in 1 2 3 4; do
            echo "::group::flyctl deploy (attempt ${attempt}/4)"
            if flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile --build-arg BUILD_SHA="$SHA" .; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 4 ]; then
              backoff=$((attempt * attempt * 10))
              echo "::warning::flyctl deploy failed (attempt ${attempt}/4); retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::flyctl deploy failed after 4 attempts"; exit 1
