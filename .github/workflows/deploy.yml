name: Build and deploy Falchion to GitHub Pages and Fly.io

# Every push to every branch (and manual dispatch) is checked and deployed.
# Each deploy overwrites the previous one, so the most recent commit on any
# branch is what ends up live.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NO workflow-level concurrency: cancelling the whole run on a newer push
# would also cancel an in-flight Fly deploy. Concurrency is set per job.

jobs:
  build:
    name: Typecheck, test, specs, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cancelling a build is safe; only the newest site needs to deploy.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    env:
      OPENSPEC_TELEMETRY: '0'
    outputs:
      pages: ${{ steps.pages_gate.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run spec:validate
      - run: npm run build
      - name: Server smoke test
        run: |
          STATIC_DIR=dist PORT=8090 node server/index.mjs &
          for i in $(seq 1 20); do curl -fsS localhost:8090/healthz && break; sleep 0.5; done
          curl -fsS localhost:8090/ | grep -q '<div id="app">'
          curl -fsS localhost:8090/api/info
          curl -fsS localhost:8090/api/clock | grep -q '"msPerTick":60000'
          (curl -sN --max-time 2 localhost:8090/api/ticks || true) | grep -q 'event: tick'
          kill %1
      # Pre-bootstrap is "skip, don't fail": until Pages is enabled with
      # source "GitHub Actions" (Settings -> Pages), the Pages deploy skips.
      - name: Check Pages readiness
        id: pages_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -qx workflow; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled with source 'GitHub Actions'; skipping Pages deploy. Enable it in Settings -> Pages."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages_gate.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages_gate.outputs.ready == 'true'
        with:
          path: dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    # Never cancel a Pages deploy mid-flight: an orphaned in-progress
    # deployment blocks later deploys. Queue them; the newest lands last.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-fly:
    name: Deploy to Fly.io
    needs: build
    runs-on: ubuntu-latest
    # Only the canonical repo deploys (forks fall through cleanly).
    if: ${{ contains(fromJSON('["rubentipparach/falchion", "RubenTipparach/Falchion"]'), github.repository) }}
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      APP: falchion
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Pre-bootstrap is "skip, don't fail": a missing/invalid token or a
      # not-yet-created app marks ready=false. See server/fly.toml for setup.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set; skipping Fly deploy. See server/fly.toml for one-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN rejected by Fly; skipping. Regenerate with 'fly tokens create deploy -a $APP'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl status -a "$APP" > /dev/null 2>&1; then
            echo "::notice::Fly app '$APP' not found; skipping. Bootstrap with 'fly apps create $APP'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Discord sign-in secrets live in GitHub (Settings -> Secrets -> Actions) and are
      # staged onto Fly here, so docs/discord.md needs no flyctl on your machine.
      # Each is optional: sign-in stays off until all three are set.
      - name: Sync Discord secrets to Fly
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # Same secret as High Frontier: comma-separated Discord ids for the /admin portal.
          ADMIN_DISCORD_ID: ${{ secrets.ADMIN_DISCORD_ID }}
          # Channel notifications as the bot (optional).
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          args=()
          for name in DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET SESSION_SECRET ADMIN_DISCORD_ID DISCORD_BOT_TOKEN DISCORD_CHANNEL_ID; do
            [ -n "${!name}" ] && args+=("$name=${!name}")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::notice::Discord secrets not set in GitHub; sign-in stays off. See docs/discord.md."
          elif ! flyctl secrets set --stage -a "$APP" "${args[@]}" > /dev/null; then
            echo "::warning::Could not stage Discord secrets on Fly (token scope?). Set them with 'fly secrets set' instead."
          fi

      # Saves live on one volume, so run exactly one machine (one writer).
      - name: Single machine for the save volume
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count 1 -a "$APP" --yes || echo "::warning::Could not scale to one machine; scale manually with 'fly scale count 1'."

      # fly deploy only creates volumes for new machines, not for the one already
      # running: make sure the save volume exists, in the region that machine is in.
      - name: Ensure save volume
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list -a "$APP" --json | jq -e 'map(select(.name == "falchion_data")) | length > 0' > /dev/null; then
            echo "Save volume falchion_data exists."; exit 0
          fi
          region="$(flyctl machines list -a "$APP" --json | jq -r '.[0].region // empty')"
          region="${region:-$(sed -n 's/^primary_region = "\(.*\)"/\1/p' server/fly.toml)}"
          echo "Creating save volume falchion_data (1 GB) in ${region}"
          flyctl volumes create falchion_data -a "$APP" -r "$region" -s 1 --yes

      # Built from the repo root (see server/Dockerfile). Retries with
      # backoff because Fly's remote builder can drop connections transiently.
      - name: Deploy to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          SHA="$(git rev-parse --short HEAD)"
          for attempt in 1 2 3 4; do
            echo "::group::flyctl deploy (attempt ${attempt}/4)"
            if flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile --build-arg BUILD_SHA="$SHA" .; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 4 ]; then
              backoff=$((attempt * attempt * 10))
              echo "::warning::flyctl deploy failed (attempt ${attempt}/4); retrying in ${backoff}s"
              sleep "$backoff"
            fi
          done
          echo "::error::flyctl deploy failed after 4 attempts"; exit 1

      # Proves the live site answers (this also wakes an auto-stopped machine) and,
      # when it does not, prints the machine state and recent logs right here.
      - name: Check the live site
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          url="https://${APP}.fly.dev"
          for i in $(seq 1 12); do
            if curl -fsS -m 20 "$url/healthz" > /dev/null && curl -fsS -m 20 "$url/" | grep -q '<div id="app">'; then
              echo "Live: $url"; curl -fsS -m 20 "$url/api/info"; echo; exit 0
            fi
            sleep 5
          done
          echo "::error::$url is not answering. Machine state and recent logs follow."
          flyctl status -a "$APP" || true
          flyctl machines list -a "$APP" || true
          flyctl logs -a "$APP" --no-tail 2>&1 | tail -n 150 || true
          exit 1
